name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release for the pushed tag
  id-token: write # OIDC: npm Trusted Publishing, no token, no OTP

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1；Node 22 自带 npm 10
      - name: Upgrade npm for OIDC publishing
        run: |
          npm install -g npm@latest
          npm --version

      # 包本身零依赖；不跑 npm ci，避免缺 lockfile
      - name: Syntax + smoke
        run: |
          node --version
          npm --version
          npm run check
          npm run smoke

      - name: Verify tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $TAG != package.json $PKG"; exit 1
          fi

      - name: Publish (Trusted Publishing)
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "dsh-motion ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
